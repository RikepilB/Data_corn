[project]
name = "datacorn-api"
version = "0.1.0"
description = "Data Corn API: corn decision support with NASA Earth observations"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi==0.163.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.3",
  "earthengine-api==1.7.52",
  "httpx==0.28.1",
  "numpy==2.5.4",
  "scipy==1.18.1",
  "pyyaml==6.0.3",
  "google-cloud-storage==3.17.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datacorn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
